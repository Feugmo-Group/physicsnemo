defaults:
  - physics: kolmogorov
  - _self_

model:
  hidden_dim: 16
  n_layers: 3
  backbone: kan      # LegendreKAN backbone — key feature of this example
  poly_degree: 6

train:
  n_pretrain: 5000   # seed (ψ, ω) near the exact forced steady state
  pretrain_lr: 1.0e-3
  n_adam: 0          # stiff recipe: skip Adam, go pretrain → L-BFGS
  n_lbfgs: 500
  adam_lr: 5.0e-4
  seed: 42
  dtype: float64

output:
  dir: outputs/kolmogorov
  checkpoint: scen_kolmogorov.mdlus
  log_every: 100

wandb:
  enabled: false
  project: physicsnemo-electrochemistry
  entity: null
  name: kolmogorov
  tags: [kolmogorov, navier_stokes, kan, scen]
