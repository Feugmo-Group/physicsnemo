[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ct-to-physicsnemo"
version = "0.1.0"
description = "PINN-based tortuosity estimator for graphite electrode microstructures"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "scikit-image",
    "scipy",
    "tifffile",
    "pandas",
    "physicsnemo",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ct_to_physicsnemo*"]
