defaults:
  - physics: cahn_hilliard
  - _self_

model:
  hidden_dim: 64
  n_layers: 3
  backbone: mlp
  poly_degree: 4

train:
  n_adam: 3000
  n_lbfgs: 300
  adam_lr: 1.0e-3
  seed: 42
  dtype: float32

output:
  dir: outputs/cahn_hilliard
  checkpoint: scen_cahn_hilliard.mdlus
  log_every: 100

wandb:
  enabled: false
  project: physicsnemo-electrochemistry
  entity: null
  name: cahn_hilliard
  tags: [cahn_hilliard, phase_field, scen]
