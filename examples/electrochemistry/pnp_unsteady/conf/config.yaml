defaults:
  - physics: pnp_unsteady
  - _self_

model:
  hidden_dim: 64
  n_layers: 3
  backbone: mlp
  poly_degree: 4

train:
  n_adam: 10000
  n_lbfgs: 200
  adam_lr: 1.0e-3
  seed: 42
  dtype: float64

output:
  dir: outputs/pnp_unsteady
  checkpoint: scen_pnp_unsteady.mdlus
  log_every: 100

wandb:
  enabled: false
  project: physicsnemo-electrochemistry
  entity: null
  name: pnp_unsteady
  tags: [pnp, unsteady, space_time, scen]
