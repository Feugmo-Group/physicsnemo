defaults:
  - physics: gouy_chapman
  - _self_

model:
  hidden_dim: 64
  n_layers: 3
  backbone: mlp
  poly_degree: 4

train:
  n_adam: 5000
  n_lbfgs: 500
  adam_lr: 1.0e-3
  seed: 42
  dtype: float64
  variant: linear   # "linear" or "nonlinear"

output:
  dir: outputs/gouy_chapman
  checkpoint: scen_gouy_chapman.mdlus
  log_every: 100

wandb:
  enabled: false
  project: physicsnemo-electrochemistry
  entity: null
  name: gouy_chapman
  tags: [gouy_chapman, poisson_boltzmann, debye_layer, scen]
