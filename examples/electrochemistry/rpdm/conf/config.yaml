defaults:
  - optimizer: adam
  - _self_

model:
  layer_size: 256
  nr_layers: 6

# structured-grid resolution for physicsnemo.mesh sampling over the
# space-time rectangle x in [0, 1], y in [0, yf].
mesh:
  n_x: 64
  n_y: 64

optimizer:
  lr: 1e-3

scheduler:
  decay_rate: 0.95
  decay_steps: 2000

training:
  max_steps: 20000
  log_freq: 100
  seed: 0

batch_size:
  Interior: 2000
  Left: 500
  Right: 500
  Initial: 500

custom:
  transpassive: false

# final validation / inference block (meshgrid evaluation + figure)
validation:
  enabled: true
  n_x: 128
  n_y: 128
