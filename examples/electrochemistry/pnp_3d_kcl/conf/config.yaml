defaults:
  - physics: pnp_3d_kcl
  - _self_

model:
  hidden_dim: 64
  n_layers: 3
  backbone: mlp
  poly_degree: 4

train:
  n_adam: 3000
  n_lbfgs: 200
  adam_lr: 1.0e-3
  seed: 42
  dtype: float32

output:
  dir: outputs/pnp_3d_kcl
  checkpoint: scen_pnp_3d_kcl.mdlus
  log_every: 100

wandb:
  enabled: false
  project: physicsnemo-electrochemistry
  entity: null
  name: pnp_3d_kcl
  tags: [pnp, 3d, kcl, scen]
