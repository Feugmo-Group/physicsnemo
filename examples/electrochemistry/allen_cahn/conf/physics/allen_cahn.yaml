# Allen-Cahn domain and physics parameters
domain:
  a: -1.0
  b:  1.0
  N_per_element: 48   # needs ~10 nodes in interface width ε√2 ≈ 0.14
  alpha: 0.7          # KTE clustering to resolve interface at x = 0
  quadrature: lgl
  mapping: kte

physics:
  eps_sq: 0.01        # ε² (interface width ~ ε√2 ≈ 0.14 for eps_sq=0.01)
  lambda_bc: 100.0
