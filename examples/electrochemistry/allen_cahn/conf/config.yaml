defaults:
  - physics: allen_cahn
  - _self_

model:
  hidden_dim: 64
  n_layers: 3
  backbone: mlp
  poly_degree: 4

train:
  n_pretrain: 15000  # seed network near tanh(x/ε√2) before physics loss
  pretrain_lr: 5.0e-4
  n_adam: 0          # skip Adam; go directly to L-BFGS from pretrained state
  n_lbfgs: 500
  adam_lr: 1.0e-4
  grad_clip: 1.0
  seed: 42
  dtype: float64

output:
  dir: outputs/allen_cahn
  checkpoint: scen_allen_cahn.mdlus
  log_every: 100

wandb:
  enabled: false
  project: physicsnemo-electrochemistry
  entity: null
  name: allen_cahn
  tags: [allen_cahn, scen]
