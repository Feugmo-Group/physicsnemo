defaults:
  - physics: convection_diffusion
  - _self_

model:
  hidden_dim: 64
  n_layers: 3
  backbone: mlp
  poly_degree: 4

train:
  n_adam: 2000
  n_lbfgs: 200
  adam_lr: 1.0e-3
  seed: 42
  dtype: float32

output:
  dir: outputs/convection_diffusion
  checkpoint: scen_convection_diffusion.mdlus
  log_every: 100

wandb:
  enabled: false
  project: physicsnemo-electrochemistry
  entity: null
  name: convection_diffusion
  tags: [convection_diffusion, boundary_layer, scen]
