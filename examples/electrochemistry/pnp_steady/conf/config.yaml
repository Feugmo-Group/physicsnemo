defaults:
  - physics: pnp_steady
  - _self_

model:
  hidden_dim: 64
  n_layers: 3
  backbone: mlp       # "mlp" or "kan"
  poly_degree: 4      # KAN only

# Two-phase training schedule
train:
  n_pretrain: 1000   # seed networks near exact solution before physics loss
  pretrain_lr: 1.0e-2
  n_adam: 5000
  n_lbfgs: 500
  adam_lr: 1.0e-3
  seed: 42
  dtype: float64

# Output
output:
  dir: outputs/pnp_steady
  checkpoint: scen_pnp_steady.mdlus
  log_every: 100

# Weights & Biases logging (set enabled: true to activate)
wandb:
  enabled: false
  project: physicsnemo-electrochemistry
  entity: null   # your W&B entity/username, or null for default
  name: pnp_steady
  tags: [pnp, steady, scen]
