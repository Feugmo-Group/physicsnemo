# 1D Steady Poisson-Nernst-Planck — domain and physical parameters
domain:
  a: -3.0
  b:  3.0
  # Element boundaries: [-3, -2, -1, 0, 1, 2, 3] → 6 uniform elements
  boundaries: [-3.0, -2.0, -1.0, 0.0, 1.0, 2.0, 3.0]
  N_per_element: 16  # LGL nodes per element
  alpha: 0.0         # KTE stretching parameter (0 = uniform)
  quadrature: lgl
  mapping: kte

physics:
  # Exact solution: cp = sin(πx)+cos(πx), cn = sin(πx), phi = cos(πx)
  # BCs at x = ±3:  cp = -1, cn = 0, phi = -1
  bc_cp_left:  -1.0
  bc_cp_right: -1.0
  bc_cn_left:   0.0
  bc_cn_right:  0.0
  bc_phi_left: -1.0
  bc_phi_right: -1.0

  # Loss weights [interior residual, boundary penalty]
  lambda_bc: 200.0
  lambda_c0: 10.0    # C0 continuity at element interfaces
  lambda_c1: 10.0    # C1 flux continuity at element interfaces
