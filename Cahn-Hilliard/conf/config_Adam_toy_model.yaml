defaults:
  - physicsnemo_default
  - optimizer: adam
  - loss: sum
  - scheduler: exponential_lr
  - _self_


scheduler:
  gamma: 1

amp:
  enabled: false


training:
   rec_monitor_freq: 200
   rec_constraint_freq: 200
   rec_inference_freq: 200
   max_steps : 40000
   ntk:
     use_ntk: False
     save_name: null
     run_freq: 10

batch_size:
  boundary: 2000
  initial: 2000
  interior: 8000

optimizer:
   lr: 1e-3

hydra:
  job:
    chdir: true
  run:
    dir: ./outputs/Adam

cuda_graphs: true

graph:
  func_arch: true

custom:
  quasirandom: true